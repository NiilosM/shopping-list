<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopping Inventory Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            padding-bottom: 5rem;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .status-now { background-color: #fee2e2; color: #991b1b; }
        .status-soon, .status-sooner { background-color: #fef3c7; color: #92400e; }
        .status-later { background-color: #e0f2fe; color: #075985; }
        tr:hover { background-color: #f1f5f9; transition: background 0.2s; }
        .is-done { opacity: 0.5; text-decoration: line-through; }
        
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Mobile specific tweaks */
        @media (max-width: 640px) {
            .btn-touch { min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; }
            input, select, button { font-size: 16px !important; } /* Prevents iOS zoom on focus */
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Error Alert -->
        <div id="error-banner" class="hidden mb-6 p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-r-xl shadow-sm">
            <p class="font-bold">Connection Issue</p>
            <p id="error-message" class="text-sm">Details will appear here...</p>
        </div>

        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Shopping Inventory</h1>
                <p class="text-slate-500">Cloud Synced Dashboard</p>
            </div>
            <div class="flex gap-2">
                <div id="sync-status" class="flex items-center gap-2 text-sm font-medium text-slate-600 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100">
                    <div id="loading-spinner" class="loader"></div>
                    <span id="status-text">Connecting...</span>
                </div>
                <button onclick="fetchData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-medium shadow-sm transition-all text-sm flex items-center gap-2 btn-touch">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                    <span class="hidden sm:inline">Refresh</span>
                </button>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6 mb-8">
            <div class="glass-card p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm font-medium uppercase tracking-wider">Total Items</p>
                <h3 id="total-count" class="text-3xl font-bold text-slate-800">0</h3>
            </div>
            <div class="glass-card p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-red-400">
                <p class="text-slate-500 text-sm font-medium uppercase tracking-wider">Urgent (Now)</p>
                <h3 id="now-count" class="text-3xl font-bold text-red-600">0</h3>
            </div>
            <div class="glass-card p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-400">
                <p class="text-slate-500 text-sm font-medium uppercase tracking-wider">Marked Done</p>
                <h3 id="done-count" class="text-3xl font-bold text-emerald-600">0</h3>
            </div>
        </div>

        <!-- Add/Edit Form -->
        <div class="glass-card p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 id="form-title" class="text-lg font-semibold text-slate-800">Add New Item</h2>
                <button id="cancel-edit" class="hidden text-sm text-red-500 font-medium hover:underline px-2 py-1" onclick="resetForm()">Cancel Edit</button>
            </div>
            <form id="addItemForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="hidden" id="editRowIndex" value="">
                <div class="md:col-span-1">
                    <input type="text" id="newItemName" placeholder="What do you need?" required class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="w-full">
                    <select id="newItemCategory" onchange="checkCustomCategory(this.value)" class="w-full px-4 py-3 border border-slate-200 rounded-lg outline-none bg-white transition-all">
                        <!-- Dynamically populated from JS -->
                    </select>
                    <div id="customCategoryInputWrapper" class="hidden mt-2 flex gap-2">
                        <input type="text" id="customCategoryName" placeholder="Custom Category Name" class="flex-grow px-3 py-2 border border-slate-200 rounded-lg outline-none text-sm bg-white">
                        <button type="button" onclick="saveCustomCategory()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-2 rounded-lg text-sm font-semibold transition-colors btn-touch">Add</button>
                        <button type="button" onclick="cancelCustomCategory()" class="text-slate-400 px-2 py-2 hover:text-slate-600 transition-colors">✕</button>
                    </div>
                </div>
                <select id="newItemUrgency" class="w-full px-4 py-3 border border-slate-200 rounded-lg outline-none bg-white transition-all">
                    <option value="Now">Now</option>
                    <option value="Soon">Soon</option>
                    <option value="Later">Later</option>
                </select>
                <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition-all flex items-center justify-center gap-2 shadow-md active:scale-95">
                    <div id="btn-spinner" class="loader hidden"></div>
                    <span id="btn-text">Add to Sheet</span>
                </button>
            </form>
        </div>

        <!-- Search and Filters -->
        <div class="flex flex-col sm:flex-row gap-4 mb-4">
            <div class="relative flex-grow">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" placeholder="Search items or categories..." class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 sm:text-sm shadow-sm transition-all">
            </div>
            <select id="filterUrgency" class="px-4 py-3 border border-slate-200 rounded-xl outline-none bg-white text-sm shadow-sm font-medium">
                <option value="all">All Priorities</option>
                <option value="now">Now</option>
                <option value="soon">Soon</option>
                <option value="later">Later</option>
            </select>
        </div>

        <!-- Table -->
        <div class="glass-card rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200">
                            <th class="p-4 font-semibold text-slate-700 text-xs uppercase tracking-wider w-16 text-center cursor-pointer" onclick="sortTable('done')">Done</th>
                            <th class="p-4 font-semibold text-slate-700 text-xs uppercase tracking-wider cursor-pointer" onclick="sortTable('Item')">Item ↕</th>
                            <th class="p-4 font-semibold text-slate-700 text-xs uppercase tracking-wider cursor-pointer" onclick="sortTable('Category')">Category ↕</th>
                            <th class="p-4 font-semibold text-slate-700 text-xs uppercase tracking-wider cursor-pointer" onclick="sortTable('Urgency')">Priority ↕</th>
                            <th class="p-4 font-semibold text-slate-700 text-xs uppercase tracking-wider text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100 bg-white">
                        <!-- Data injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Make sure to double check that this matches your actual deployed web app URL from Google Sheet
        const API_URL = 'https://script.google.com/macros/s/AKfycbyh6vANg0C6aF3r7qXH7NSqU79kMkEtrqN0JFkry9EZrBznbUwEjmHqzJHTvUMn8I6Crg/exec';
        
        let shoppingItems = [];
        let completedIds = new Set();
        let sortConfig = { key: null, direction: 'asc' };
        
        // Initial setup of system categories
        let defaultCategories = ['Grocery', 'Household', 'Tech', 'Personal Care', 'Kitchen'];

        async function fetchData() {
            const statusText = document.getElementById('status-text');
            const spinner = document.getElementById('loading-spinner');
            const errorBanner = document.getElementById('error-banner');
            const errorMessage = document.getElementById('error-message');
            
            if (spinner) spinner.classList.remove('hidden');
            if (statusText) statusText.textContent = 'Syncing...';
            if (errorBanner) errorBanner.classList.add('hidden');

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`Server responded with ${response.status}`);
                const result = await response.json();
                
                if (result.status === "success") {
                    shoppingItems = result.data || [];
                    updateCategoryDropdowns();
                    renderTable();
                    if (statusText) statusText.textContent = 'Synced';
                } else {
                    throw new Error(result.message || "Unknown API Error");
                }
            } catch (error) {
                console.error('Fetch error:', error);
                if (statusText) statusText.textContent = 'Sync Error';
                if (errorBanner) {
                    errorBanner.classList.remove('hidden');
                    errorMessage.textContent = error.message;
                }
            } finally {
                if (spinner) spinner.classList.add('hidden');
            }
        }

        function getRowValue(row, key) {
            if (!row) return '';
            return row[key] || row[key.toLowerCase()] || row[key.charAt(0).toUpperCase() + key.slice(1)] || '';
        }

        function updateCategoryDropdowns() {
            const select = document.getElementById('newItemCategory');
            if (!select) return;

            const sheetCategories = new Set();
            shoppingItems.forEach(item => {
                const cat = getRowValue(item, 'Category');
                if (cat && cat.trim() !== '') {
                    sheetCategories.add(cat.trim());
                }
            });

            // Combine starting/predefined, custom ones registered dynamically, and sheet categories
            const allCategories = new Set([...defaultCategories, ...sheetCategories]);
            const currentVal = select.value;
            
            select.innerHTML = '';
            allCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
            
            // Add custom trigger option
            const addOpt = document.createElement('option');
            addOpt.value = "__NEW__";
            addOpt.className = "text-blue-600 font-semibold";
            addOpt.textContent = "+ Add Custom Category...";
            select.appendChild(addOpt);
            
            // Restore selection if safe, otherwise default to first available option
            if (allCategories.has(currentVal)) {
                select.value = currentVal;
            } else if (currentVal === "__NEW__") {
                select.value = "__NEW__";
            } else {
                select.value = defaultCategories[0];
            }
        }

        function checkCustomCategory(val) {
            const wrapper = document.getElementById('customCategoryInputWrapper');
            if (!wrapper) return;
            if (val === '__NEW__') {
                wrapper.classList.remove('hidden');
                const customInput = document.getElementById('customCategoryName');
                if (customInput) customInput.focus();
            } else {
                wrapper.classList.add('hidden');
            }
        }

        function saveCustomCategory() {
            const input = document.getElementById('customCategoryName');
            if (!input) return;
            const newCat = input.value.trim();
            if (newCat) {
                // Ensure proper capitalization for consistent display
                const formattedCat = newCat.charAt(0).toUpperCase() + newCat.slice(1);
                if (!defaultCategories.includes(formattedCat)) {
                    defaultCategories.push(formattedCat);
                }
                updateCategoryDropdowns();
                const select = document.getElementById('newItemCategory');
                if (select) select.value = formattedCat;
                input.value = '';
                const wrapper = document.getElementById('customCategoryInputWrapper');
                if (wrapper) wrapper.classList.add('hidden');
            }
        }

        function cancelCustomCategory() {
            const input = document.getElementById('customCategoryName');
            if (input) input.value = '';
            const wrapper = document.getElementById('customCategoryInputWrapper');
            if (wrapper) wrapper.classList.add('hidden');
            const select = document.getElementById('newItemCategory');
            if (select) select.value = defaultCategories[0];
        }

        function renderTable() {
            const body = document.getElementById('tableBody');
            if (!body) return;

            const searchInput = document.getElementById('searchInput');
            const filterUrgency = document.getElementById('filterUrgency');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            const urgencyFilter = filterUrgency ? filterUrgency.value : 'all';
            
            body.innerHTML = '';
            
            let filtered = shoppingItems.filter((row) => {
                const name = getRowValue(row, 'Item').toLowerCase();
                const cat = getRowValue(row, 'Category').toLowerCase();
                const urg = getRowValue(row, 'Urgency').toLowerCase();
                
                const matchesSearch = name.includes(searchTerm) || cat.includes(searchTerm);
                const matchesUrgency = urgencyFilter === 'all' || urg === urgencyFilter;
                
                return matchesSearch && matchesUrgency;
            });

            if (sortConfig.key) {
                filtered.sort((a, b) => {
                    let valA = getRowValue(a, sortConfig.key).toString().toLowerCase();
                    let valB = getRowValue(b, sortConfig.key).toString().toLowerCase();
                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            if (filtered.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-slate-400 italic">No matching items found.</td></tr>`;
            }

            filtered.forEach((row) => {
                const globalIndex = shoppingItems.indexOf(row);
                const tr = document.createElement('tr');
                const itemName = getRowValue(row, 'Item');
                const category = getRowValue(row, 'Category');
                const urgency = getRowValue(row, 'Urgency').trim() || 'Later';
                const isDone = completedIds.has(globalIndex);
                
                if (isDone) tr.classList.add('is-done');
                
                tr.innerHTML = `
                    <td class="p-4 text-center">
                        <div class="flex justify-center items-center">
                            <input type="checkbox" ${isDone ? 'checked' : ''} 
                                   onchange="toggleDone(${globalIndex})" 
                                   class="w-6 h-6 rounded text-blue-600 border-slate-300 cursor-pointer shadow-sm">
                        </div>
                    </td>
                    <td class="p-4 font-semibold text-slate-800">${itemName || 'Empty Row'}</td>
                    <td class="p-4 text-slate-500 text-sm font-medium">${category || '-'}</td>
                    <td class="p-4">
                        <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest status-${urgency.toLowerCase()}">
                            ${urgency}
                        </span>
                    </td>
                    <td class="p-4 text-right space-x-3">
                        <button onclick="startEdit(${globalIndex})" class="text-slate-400 hover:text-blue-600 transition-all active:scale-110 p-2 inline-flex">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button onclick="deleteItem(${globalIndex})" class="text-slate-400 hover:text-red-600 transition-all active:scale-110 p-2 inline-flex">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </td>
                `;
                body.appendChild(tr);
            });
            updateStats();
        }

        function sortTable(key) {
            if (sortConfig.key === key) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = key;
                sortConfig.direction = 'asc';
            }
            renderTable();
        }

        function startEdit(index) {
            const row = shoppingItems[index];
            const editRowIndex = document.getElementById('editRowIndex');
            const newItemName = document.getElementById('newItemName');
            const newItemCategory = document.getElementById('newItemCategory');
            const newItemUrgency = document.getElementById('newItemUrgency');
            const formTitle = document.getElementById('form-title');
            const btnText = document.getElementById('btn-text');
            const cancelEditBtn = document.getElementById('cancel-edit');

            if (editRowIndex) editRowIndex.value = index;
            if (newItemName) newItemName.value = getRowValue(row, 'Item');
            
            // Rebuild category list to ensure it reflects current categories
            updateCategoryDropdowns();
            
            const editCategory = getRowValue(row, 'Category');
            if (newItemCategory) newItemCategory.value = editCategory;
            if (newItemUrgency) newItemUrgency.value = getRowValue(row, 'Urgency');
            
            if (formTitle) formTitle.innerText = "Edit Item";
            if (btnText) btnText.innerText = "Update Row";
            if (cancelEditBtn) cancelEditBtn.classList.remove('hidden');
            if (newItemName) newItemName.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            const form = document.getElementById('addItemForm');
            if (form) form.reset();

            const editRowIndex = document.getElementById('editRowIndex');
            if (editRowIndex) editRowIndex.value = "";

            const formTitle = document.getElementById('form-title');
            if (formTitle) formTitle.innerText = "Add New Item";
            
            const btnText = document.getElementById('btn-text');
            if (btnText) btnText.innerText = "Add to Sheet";
            
            const spinner = document.getElementById('btn-spinner');
            if (spinner) spinner.classList.add('hidden');
            
            const cancelEditBtn = document.getElementById('cancel-edit');
            if (cancelEditBtn) cancelEditBtn.classList.add('hidden');

            const wrapper = document.getElementById('customCategoryInputWrapper');
            if (wrapper) wrapper.classList.add('hidden');
        }

        async function deleteItem(index) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            
            const statusText = document.getElementById('status-text');
            if (statusText) statusText.textContent = 'Deleting...';
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'delete', rowIndex: index })
                });
                
                shoppingItems.splice(index, 1);
                renderTable();
                setTimeout(fetchData, 1500);
            } catch (e) {
                alert("Delete failed.");
            }
        }

        const addItemForm = document.getElementById('addItemForm');
        if (addItemForm) {
            addItemForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const spinner = document.getElementById('btn-spinner');
                const btnText = document.getElementById('btn-text');
                const editRowIndex = document.getElementById('editRowIndex');
                const newItemName = document.getElementById('newItemName');
                const newItemCategory = document.getElementById('newItemCategory');
                const newItemUrgency = document.getElementById('newItemUrgency');

                const editIndex = editRowIndex ? editRowIndex.value : '';
                
                const payload = {
                    action: editIndex !== "" ? 'update' : 'add',
                    rowIndex: editIndex !== "" ? parseInt(editIndex) : null,
                    Item: newItemName ? newItemName.value : '',
                    Category: newItemCategory ? newItemCategory.value : '',
                    Urgency: newItemUrgency ? newItemUrgency.value : ''
                };

                // Prevent submits if custom input is in active state and user didn't click 'Add'
                if (payload.Category === '__NEW__') {
                    alert('Please type or complete adding your custom category first!');
                    return;
                }

                if (btn) btn.disabled = true;
                if (spinner) spinner.classList.remove('hidden');
                if (btnText) btnText.innerText = "Syncing...";

                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(payload)
                    });

                    resetForm();
                    setTimeout(fetchData, 2000);
                } catch (error) {
                    alert('Save failed: ' + error.message);
                } finally {
                    if (btn) btn.disabled = false;
                    if (spinner) spinner.classList.add('hidden');
                    if (btnText) {
                        btnText.innerText = editIndex !== "" ? "Update Row" : "Add to Sheet";
                    }
                }
            });
        }

        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.addEventListener('input', renderTable);

        const filterUrgency = document.getElementById('filterUrgency');
        if (filterUrgency) filterUrgency.addEventListener('change', renderTable);

        window.toggleDone = (index) => {
            completedIds.has(index) ? completedIds.delete(index) : completedIds.add(index);
            renderTable();
        };

        function updateStats() {
            const totalCount = document.getElementById('total-count');
            const nowCount = document.getElementById('now-count');
            const doneCount = document.getElementById('done-count');

            if (totalCount) totalCount.innerText = shoppingItems.length;
            if (nowCount) nowCount.innerText = shoppingItems.filter(i => getRowValue(i, 'Urgency').toLowerCase().trim() === 'now').length;
            if (doneCount) doneCount.innerText = completedIds.size;
        }

        // Bulletproof execution trigger to prevent race conditions during load
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            fetchData();
        } else {
            window.addEventListener('DOMContentLoaded', fetchData);
        }
    </script>
</body>
</html>
